services:
  cobblemine:
    build: .
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${SITE_DOMAIN:-cobblemine.com}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${SITE_DOMAIN:-cobblemine.com}
    expose:
      - "80"
    networks:
      proxy:
        aliases:
          - cobblemine-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
