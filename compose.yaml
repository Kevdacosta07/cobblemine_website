services:
  cobblemine:
    build: .
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${SITE_DOMAIN:-cobblemine.com,cobblemine.fr}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${SITE_DOMAIN:-cobblemine.com,cobblemine.fr}
      COBBLEMINE_API_URL: https://api.cobblemine.com
      WEB_PROXY_SECRET_FILE: /run/secrets/web_proxy
      SITE_ORIGINS: https://cobblemine.com,https://cobblemine.fr
    secrets:
      - web_proxy
    expose:
      - "3000"
    networks:
      proxy:
        aliases:
          - cobblemine-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}

secrets:
  web_proxy:
    file: /home/docker/cobblemine_api/secrets/web_proxy
